<section class="hero">
  <div class="eyebrow" data-i18n="hero-eyebrow"></div>
  <h1 data-i18n="hero-title"></h1>
  <p class="lead" data-i18n="hero-lead"></p>
  <p data-i18n="hero-p1"></p>
  <div class="lens-legend">
    <div><b data-i18n="lens-puzzle"></b><span data-i18n="hero-lens-puzzle"></span></div>
    <div><b data-i18n="lens-landscape"></b><span data-i18n="hero-lens-landscape"></span></div>
  </div>

<!-- 1 ------------------------------------------------------------------ -->
<section id="board">
  <div class="eyebrow"><span>1</span><span data-i18n="board-eyebrow"></span></div>
  <h2 data-i18n="board-title"></h2>
  <p data-i18n="board-p1"></p>
  <div class="equation" data-eq="data"></div>
  <p data-i18n="board-p2"></p>
  <div class="equation" data-eq="forward-sde"></div>
  <div class="equation" data-eq="kernel"></div>
  <div class="equation" data-eq="marginal"></div>
  <p data-i18n="board-p3"></p>
  <div class="equation" data-eq="fokker-planck"></div>
  <div class="equation" data-eq="landscape"></div>

  <figure class="panel">
    <div class="panel-head"><span class="mode" data-i18n="mode-auto"></span><span data-i18n="board-fig-title"></span></div>
    <div class="panel-grid wide">
      <canvas id="board-forward" class="scene" tabindex="0"></canvas>
      <div class="side">
        <canvas id="board-marginal" class="plot tall"></canvas>
        <dl class="readout">
          <dt data-i18n="ro-variance"></dt><dd id="board-variance"></dd>
          <dt data-i18n="ro-contrast"></dt><dd id="board-contrast"></dd>
          <dt data-i18n="ro-snr"></dt><dd id="board-snr"></dd>
        </dl>
      </div>
    </div>
    <div class="controls">
      <label><span data-i18n="ctl-shake"></span><input id="board-time" type="range" min="0" max="1" step="0.002" value="0"><output id="board-time-out"></output></label>
      <button id="board-play" aria-pressed="false"></button>
      <label class="check"><input id="board-arrows" type="checkbox"><span data-i18n="ctl-arrows"></span></label>
    </div>
    <figcaption data-i18n="board-caption"></figcaption>
  </figure>
  <p data-i18n="board-p4"></p>
</section>

<!-- 2 ------------------------------------------------------------------ -->
<section id="family">
  <div class="eyebrow"><span>2</span><span data-i18n="family-eyebrow"></span></div>
  <h2 data-i18n="family-title"></h2>
  <p data-i18n="family-p1"></p>
  <div class="equation" data-eq="reverse-sde"></div>
  <div class="equation" data-eq="pf-ode"></div>
  <p data-i18n="family-p2"></p>
  <div class="equation" data-eq="eta-family"></div>
  <div class="equation" data-eq="toy-step"></div>
  <p data-i18n="family-p3"></p>

  <figure class="panel">
    <div class="panel-head"><span class="mode" data-i18n="mode-auto"></span><span data-i18n="family-fig-title"></span></div>
    <div class="panel-grid wide">
      <canvas id="family-board" class="scene" tabindex="0"></canvas>
      <div class="side">
        <canvas id="family-bars" class="plot"></canvas>
        <dl class="readout">
          <dt data-i18n="ro-tv"></dt><dd id="family-tv"></dd>
          <dt data-i18n="ro-spread"></dt><dd id="family-spread"></dd>
          <dt data-i18n="ro-ks"></dt><dd id="family-ks"></dd>
          <dt data-i18n="ro-floor"></dt><dd id="family-floor"></dd>
        </dl>
      </div>
    </div>
    <div class="controls">
      <label><span>η</span><input id="family-eta" type="range" min="0" max="1.5" step="0.05" value="1"><output id="family-eta-out"></output></label>
      <label><span data-i18n="ctl-progress"></span><input id="family-progress" type="range" min="0" max="1" step="0.005" value="0"><output id="family-progress-out"></output></label>
      <button id="family-play" aria-pressed="false"></button>
      <button id="family-noise" data-i18n="ctl-new-noise"></button>
      <button id="family-starts" data-i18n="ctl-new-starts"></button>
      <label class="check"><input id="family-colors" type="checkbox" checked><span data-i18n="ctl-colors"></span></label>
      <label class="check"><input id="family-paths" type="checkbox" checked><span data-i18n="ctl-paths"></span></label>
    </div>
    <figcaption data-i18n="family-caption"></figcaption>
  </figure>
  <p data-i18n="family-p4"></p>
  <div class="equation" data-eq="noncross"></div>
  <div class="equation" data-eq="flow-map"></div>
  <p data-i18n="family-p5"></p>
</section>

<!-- 3 ------------------------------------------------------------------ -->
<section id="lab">
  <div class="eyebrow"><span>3</span><span data-i18n="lab-eyebrow"></span></div>
  <h2 data-i18n="lab-title"></h2>
  <p data-i18n="lab-p1"></p>
  <div class="equation" data-eq="substitutions"></div>
  <p data-i18n="lab-p2"></p>
  <div class="equation" data-eq="metrics"></div>
  <p data-i18n="lab-p3"></p>

  <figure class="panel lab">
    <div class="panel-head"><span class="mode" data-i18n="mode-manual"></span><span data-i18n="lab-fig-title"></span></div>
    <div class="panel-grid wide">
      <canvas id="lab-board" class="scene" tabindex="0"></canvas>
      <div class="side">
        <canvas id="lab-bars" class="plot"></canvas>
        <dl class="readout">
          <dt data-i18n="ro-tv"></dt><dd><span id="lab-tv"></span> <small id="lab-tv-floor"></small></dd>
          <dt data-i18n="ro-spread"></dt><dd><span id="lab-spread"></span> <small id="lab-spread-floor"></small></dd>
          <dt data-i18n="ro-ks"></dt><dd><span id="lab-ks"></span> <small id="lab-ks-floor"></small></dd>
          <dt data-i18n="ro-step"></dt><dd id="lab-step"></dd>
          <dt data-i18n="ro-snr"></dt><dd id="lab-snr"></dd>
        </dl>
      </div>
    </div>
    <div class="knobs">
      <fieldset data-knob="prior">
        <legend><span data-i18n="knob-start"></span><small data-i18n="knob-start-analogy"></small></legend>
        <label><span>T</span><input id="lab-T" type="range" min="0.25" max="4" step="0.05" value="1"><output id="lab-T-out"></output></label>
        <div class="radio-row">
          <label><input type="radio" name="lab-start" value="exact" checked><span data-i18n="ctl-start-exact"></span></label>
          <label><input type="radio" name="lab-start" value="prior"><span data-i18n="ctl-start-prior"></span></label>
        </div>
      </fieldset>
      <fieldset data-knob="score">
        <legend><span data-i18n="knob-score"></span><small data-i18n="knob-score-analogy"></small></legend>
        <label><span data-i18n="ctl-bias"></span><input id="lab-bias" type="range" min="-2" max="2" step="0.1" value="0"><output id="lab-bias-out"></output></label>
        <label><span data-i18n="ctl-smooth"></span><input id="lab-smooth" type="range" min="0" max="0.1" step="0.002" value="0"><output id="lab-smooth-out"></output></label>
      </fieldset>
      <fieldset data-knob="grid">
        <legend><span data-i18n="knob-grid"></span><small data-i18n="knob-grid-analogy"></small></legend>
        <label><span data-i18n="ctl-nfe"></span><select id="lab-nfe"><option>8</option><option>16</option><option>32</option><option>64</option><option selected>128</option><option>256</option><option>512</option></select></label>
        <label><span data-i18n="ctl-solver"></span><select id="lab-solver"><option value="auto" data-i18n="solver-auto"></option><option value="euler" data-i18n="solver-euler"></option><option value="heun" data-i18n="solver-heun"></option></select></label>
      </fieldset>
      <fieldset data-knob="process">
        <legend><span data-i18n="knob-process"></span><small data-i18n="knob-process-analogy"></small></legend>
        <label><span>η</span><input id="lab-eta" type="range" min="0" max="1.5" step="0.05" value="1"><output id="lab-eta-out"></output></label>
        <label><span data-i18n="ctl-count"></span><select id="lab-count"><option>512</option><option selected>2048</option><option>8192</option></select></label>
      </fieldset>
    </div>
    <div class="controls">
      <label><span data-i18n="ctl-progress"></span><input id="lab-progress" type="range" min="0" max="1" step="0.005" value="1"><output id="lab-progress-out"></output></label>
      <button id="lab-play" aria-pressed="false"></button>
      <button id="lab-noise" data-i18n="ctl-new-noise"></button>
      <button id="lab-reset" data-i18n="ctl-reset"></button>
      <span id="lab-status" class="status"></span>
    </div>
    <figcaption data-i18n="lab-caption"></figcaption>
  </figure>

  <h3 id="prior"><span>3.1</span><span data-i18n="prior-title"></span></h3>
  <p data-i18n="prior-p1"></p>
  <div class="equation" data-eq="snr"></div>
  <div class="equation" data-eq="kl-bound"></div>
  <p data-i18n="prior-p2"></p>
  <figure class="panel">
    <div class="panel-head"><span class="mode" data-i18n="mode-manual"></span><span data-i18n="prior-fig-title"></span></div>
    <div class="panel-grid two">
      <canvas id="prior-marginal" class="plot tall"></canvas>
      <canvas id="prior-kl" class="plot tall"></canvas>
    </div>
    <div class="controls">
      <label><span>T</span><input id="prior-T" type="range" min="0.25" max="4" step="0.05" value="1"><output id="prior-T-out"></output></label>
      <span class="status" id="prior-readout"></span>
    </div>
    <figcaption data-i18n="prior-caption"></figcaption>
  </figure>
  <p data-i18n="prior-p3"></p>

  <h3 id="score"><span>3.2</span><span data-i18n="score-title"></span></h3>
  <p data-i18n="score-p1"></p>
  <div class="equation" data-eq="dsm"></div>
  <div class="equation" data-eq="dsm-min"></div>
  <p data-i18n="score-p2"></p>
  <div class="equation" data-eq="perturbed"></div>
  <figure class="panel">
    <div class="panel-head"><span class="mode" data-i18n="mode-manual"></span><span data-i18n="score-fig-title"></span></div>
    <div class="panel-grid two">
      <canvas id="score-exact" class="scene"></canvas>
      <canvas id="score-perturbed" class="scene"></canvas>
    </div>
    <div class="controls">
      <label><span data-i18n="ctl-time"></span><input id="score-time" type="range" min="0" max="1" step="0.002" value="0.368"><output id="score-time-out"></output></label>
      <label><span data-i18n="ctl-bias"></span><input id="score-bias" type="range" min="-2" max="2" step="0.1" value="1"><output id="score-bias-out"></output></label>
      <label><span data-i18n="ctl-smooth"></span><input id="score-smooth" type="range" min="0" max="0.1" step="0.002" value="0.03"><output id="score-smooth-out"></output></label>
      <button id="score-apply" data-i18n="ctl-apply-lab"></button>
    </div>
    <figcaption data-i18n="score-caption"></figcaption>
  </figure>
  <p data-i18n="score-p3"></p>
  <p data-i18n="score-p4"></p>

  <h3 id="grid"><span>3.3</span><span data-i18n="grid-title"></span></h3>
  <p data-i18n="grid-p1"></p>
  <div class="equation" data-eq="em"></div>
  <div class="equation" data-eq="euler-ode"></div>
  <div class="equation" data-eq="heun"></div>
  <p data-i18n="grid-p2"></p>
  <div class="equation" data-eq="ve-step"></div>
  <figure class="panel">
    <div class="panel-head"><span class="mode" data-i18n="mode-manual"></span><span data-i18n="grid-fig-title"></span></div>
    <div class="panel-grid two">
      <canvas id="grid-spread" class="plot tall"></canvas>
      <canvas id="grid-ks" class="plot tall"></canvas>
    </div>
    <div class="controls">
      <button id="grid-run" data-i18n="ctl-compute"></button>
      <span class="status" id="grid-status"></span>
    </div>
    <figcaption data-i18n="grid-caption"></figcaption>
  </figure>
  <p data-i18n="grid-p3"></p>
</section>

<!-- 4 ------------------------------------------------------------------ -->
<section id="budget">
  <div class="eyebrow"><span>4</span><span data-i18n="budget-eyebrow"></span></div>
  <h2 data-i18n="budget-title"></h2>
  <p data-i18n="budget-p1"></p>
  <figure class="panel">
    <div class="panel-head"><span class="mode" data-i18n="mode-manual"></span><span data-i18n="budget-fig-title"></span></div>
    <div class="panel-grid four">
      <canvas id="sweep-T" class="plot tall"></canvas>
      <canvas id="sweep-bias" class="plot tall"></canvas>
      <canvas id="sweep-smooth" class="plot tall"></canvas>
      <canvas id="sweep-nfe" class="plot tall"></canvas>
    </div>
    <div class="controls">
      <button id="sweep-run" data-i18n="ctl-recompute"></button>
      <span class="status" id="sweep-status"></span>
    </div>
    <figcaption data-i18n="budget-caption"></figcaption>
  </figure>
  <ol class="observations" data-i18n="budget-list"></ol>
  <p data-i18n="budget-p2"></p>
</section>

<!-- 5 ------------------------------------------------------------------ -->
<section id="flow">
  <div class="eyebrow"><span>5</span><span data-i18n="flow-eyebrow"></span></div>
  <h2 data-i18n="flow-title"></h2>
  <p data-i18n="flow-p1"></p>
  <div class="equation" data-eq="fm-velocity"></div>
  <div class="equation" data-eq="fm-identification"></div>
  <p data-i18n="flow-p2"></p>
  <ol class="observations" data-i18n="flow-list"></ol>
  <p data-i18n="flow-p3"></p>
</section>

<!-- 6 ------------------------------------------------------------------ -->
<section id="limits">
  <div class="eyebrow"><span>6</span><span data-i18n="limits-eyebrow"></span></div>
  <h2 data-i18n="limits-title"></h2>
  <ul data-i18n="limits-list"></ul>
  <h3 data-i18n="scope-title"></h3>
  <ul data-i18n="scope-list"></ul>
  <h3 data-i18n="sources-title"></h3>
  <table class="sources" id="sources-table"></table>
  <p class="credit" data-i18n="photo-credit"></p>
</section>

</main>
</div>
<footer><span data-i18n="footer"></span></footer>
</body>
