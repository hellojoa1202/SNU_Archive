name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify JavaScript and mathematics
        working-directory: 2026-2-Special-Topics-in-System-Software/Diffusion-Detective
        run: |
          node --check app.js
          node --check i18n.js
          node --check math.js
          node --check dial.js
          node --check dial-math.js
          node --check equations.js
          node --test math.test.cjs dial.test.cjs
      - name: Assemble website and preserve previous links
        run: |
          site_project="_site/2026-2-Special-Topics-in-System-Software/Diffusion-Detective"
          mkdir -p "$site_project"
          cp 2026-2-Special-Topics-in-System-Software/Diffusion-Detective/index.html "$site_project/"
          cp 2026-2-Special-Topics-in-System-Software/Diffusion-Detective/app.js "$site_project/"
          cp 2026-2-Special-Topics-in-System-Software/Diffusion-Detective/i18n.js "$site_project/"
          cp 2026-2-Special-Topics-in-System-Software/Diffusion-Detective/math.js "$site_project/"
          cp 2026-2-Special-Topics-in-System-Software/Diffusion-Detective/style.css "$site_project/"
          cp 2026-2-Special-Topics-in-System-Software/Diffusion-Detective/dial.css "$site_project/"
          cp 2026-2-Special-Topics-in-System-Software/Diffusion-Detective/dial.js "$site_project/"
          cp 2026-2-Special-Topics-in-System-Software/Diffusion-Detective/dial-math.js "$site_project/"
          cp 2026-2-Special-Topics-in-System-Software/Diffusion-Detective/equations.js "$site_project/"
          cp -R "2026-2-Special-Topics-in-System-Software/Diffusion-Detective/English ver" "$site_project/"
          cp -R "2026-2-Special-Topics-in-System-Software/Diffusion-Detective/Korean ver" "$site_project/"
          printf '%s\n' '<!doctype html><html lang="ko"><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=2026-2-Special-Topics-in-System-Software/Diffusion-Detective/"><title>SNU Archive</title><a href="2026-2-Special-Topics-in-System-Software/Diffusion-Detective/">Diffusion Detective</a></html>' > _site/index.html
          printf '%s\n' '<!doctype html><html lang="ko"><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=Diffusion-Detective/"><title>Diffusion Detective</title><a href="Diffusion-Detective/">Diffusion Detective</a></html>' > _site/2026-2-Special-Topics-in-System-Software/index.html
          for language in English Korean; do
            mkdir -p "$site_project/$language"
            printf '<!doctype html><html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=../%s%%20ver/"><title>Diffusion Detective</title><a href="../%s%%20ver/">%s ver</a></html>\n' "$language" "$language" "$language" > "$site_project/$language/index.html"
          done
          touch _site/.nojekyll
      - name: Version browser assets by content
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          project = Path('_site/2026-2-Special-Topics-in-System-Software/Diffusion-Detective')
          for folder in ['English ver', 'Korean ver']:
              page = project / folder / 'index.html'
              html = page.read_text()
              for filename in ['app.js', 'math.js', 'i18n.js', 'style.css', 'dial.css', 'dial.js', 'dial-math.js', 'equations.js']:
                  digest = sha256((project / filename).read_bytes()).hexdigest()[:12]
                  html = html.replace('"../' + filename + '"', '"../' + filename + '?v=' + digest + '"')
              page.write_text(html)
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload website
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5
