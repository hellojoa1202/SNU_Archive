name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify JavaScript and mathematics
        working-directory: 2026-2-Special-Topics-in-System-Software
        run: |
          node --check dist/app.js
          node --check dist/math.js
          node --test tests/math.test.cjs
      - name: Assemble archive website
        run: |
          mkdir -p _site/2026-2-Special-Topics-in-System-Software
          cp index.html _site/index.html
          cp -R 2026-2-Special-Topics-in-System-Software/dist/. _site/2026-2-Special-Topics-in-System-Software/
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
